name: Case Rename Policy

# Source workflow: reconciliation copies this trusted file into every active
# managed repository before requiring its `Case rename policy` status check.
# Blocks pull requests that rename tracked files changing only letter casing
# (e.g. Readme.md -> readme.md), that leave tracked paths colliding
# case-insensitively (e.g. Docs/a.md + docs/A.md), or that add a path under a
# differently-cased spelling of an existing path (e.g. docs/README.md where
# DOCS/ exists). All three break checkouts on the case-insensitive filesystems
# (Windows/macOS defaults) used across the org.
#
# Security: checks out the base branch commit explicitly
# (ref: github.event.pull_request.base.sha) and fetches the PR head as git
# objects only — PR files are never checked out to disk and nothing from the PR
# tree is executed. On private/internal repos the central immutable-workflows
# ruleset runs this workflow from org-github-management@main and the
# protected-workflow-paths push ruleset blocks edits to managed workflow files;
# on public repos (where GitHub push rulesets and internal-sourced ruleset
# workflows do not apply) fork PRs modifying .github/workflows/* require
# maintainer approval to run Actions, the "Guard managed workflow files" step
# below catches accidental or isolated edits (such as editing
# conventional-pr-title.yml alone), and reconcile restores canonical workflow
# files on main (#1192). Keep the token read-only: do not enable modes that
# comment on or otherwise modify pull requests.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  case-rename-policy:
    name: Case rename policy
    # This repository is intentionally outside management scope
    # (config/management-exclusions.yaml) — the check runs on managed repos only.
    if: github.repository != 'AgicCompany/org-github-management'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Explicitly check out the base commit — trusted content, immune to any
      # case collision on the PR branch. Full history is needed for the
      # merge-base computation.
      - name: Checkout base repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head objects
        run: git fetch --no-tags origin "$HEAD_SHA"

      # Reconcile owns the distributed PR-check workflows; pull requests in
      # managed repositories must not modify or delete them to weaken their own
      # required checks (#1192).
      - name: Guard managed workflow files
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" \
            || { echo "git merge-base failed — cannot evaluate the diff"; exit 1; }
          changed="$(git diff --name-only "$merge_base" "$HEAD_SHA" -- \
            .github/workflows/conventional-pr-title.yml \
            .github/workflows/case-rename-policy.yml)" \
            || { echo "git diff failed — cannot evaluate managed workflow files"; exit 1; }
          if [[ -n "$changed" ]]; then
            printf 'Managed workflow file modified in pull request:\n%s\n' "$changed"
            echo "These workflow files are reconciled centrally from org-github-management" \
              "and must not be edited in pull requests."
            exit 1
          fi
          echo "Managed workflow files are unchanged."

      # The policy is relational — did a path's casing change between the merge
      # base and the head? — so compare folded path spellings between the two
      # trees. Rename detection (-M) would miss a case-only rename whose content
      # changed enough to fall below the similarity threshold; a single-tree
      # scan would miss a lone rename (no collision remains in one tree).
      # Folded keys with several distinct base spellings (a pre-existing
      # collision) are ambiguous, so rename inference skips them; the collision
      # step below still rejects a head that leaves such a collision in place.
      - name: Detect case-only renames
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" \
            || { echo "git merge-base failed — cannot evaluate the diff"; exit 1; }
          base_tree="$(git ls-tree -r --name-only "$merge_base")" \
            || { echo "git ls-tree failed on the merge base"; exit 1; }
          head_tree="$(git ls-tree -r --name-only "$HEAD_SHA")" \
            || { echo "git ls-tree failed on the head tree"; exit 1; }
          declare -A base_spelling=()
          # Ambiguous folded keys (multiple distinct base spellings): a head
          # spelling difference there may be collision cleanup, not a rename.
          declare -A base_ambiguous=()
          while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              folded="${path,,}"
              if [[ -n "${base_spelling[$folded]:-}" && "${base_spelling[$folded]}" != "$path" ]]; then
                base_ambiguous["$folded"]=1
              fi
              base_spelling["$folded"]="$path"
            fi
          done <<< "$base_tree"
          conflicts=0
          while IFS= read -r path; do
            if [[ -z "$path" ]]; then continue; fi
            folded="${path,,}"
            if [[ -n "${base_ambiguous[$folded]:-}" ]]; then continue; fi
            if [[ -n "${base_spelling[$folded]:-}" && "${base_spelling[$folded]}" != "$path" ]]; then
              printf 'Case-only rename: %s -> %s\n' "${base_spelling[$folded]}" "$path"
              conflicts=1
            fi
          done <<< "$head_tree"
          if [[ "$conflicts" -ne 0 ]]; then
            echo "Keep the original casing, or choose a final path that differs" \
              "by more than letter case."
            exit 1
          fi
          echo "No case-only renames found."

      # Catches colliding paths regardless of how the commits introduced them
      # (a pure add of a colliding path is not a rename).
      - name: Detect case-colliding paths
        run: |
          tree="$(git ls-tree -r --name-only "$HEAD_SHA")" \
            || { echo "git ls-tree failed — cannot evaluate the tree"; exit 1; }
          declare -A seen=()
          conflicts=0
          while IFS= read -r path; do
            if [[ -z "$path" ]]; then continue; fi
            folded="${path,,}"
            if [[ -n "${seen[$folded]:-}" ]]; then
              printf 'Case-insensitive collision: %s <-> %s\n' "${seen[$folded]}" "$path"
              conflicts=1
            else
              seen[$folded]="$path"
            fi
          done <<< "$tree"
          if [[ "$conflicts" -ne 0 ]]; then
            echo "Tracked paths must be unique under ASCII case folding:" \
              "Windows and macOS checkouts cannot hold both."
            exit 1
          fi
          echo "No case-colliding paths found."

      # A head-only tree scan misses additions under a differently-cased
      # spelling of a path that only exists in the base tree (docs/README.md
      # added where only DOCS/ existed): the merged tree never materializes,
      # so the collision is invisible in either tree alone. Compare head paths
      # against every base path AND its directory prefixes, case-folded.
      - name: Detect paths colliding with base-tree paths
        run: |
          merge_base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" \
            || { echo "git merge-base failed — cannot evaluate the diff"; exit 1; }
          base_tree="$(git ls-tree -r --name-only "$merge_base")" \
            || { echo "git ls-tree failed on the merge base"; exit 1; }
          head_tree="$(git ls-tree -r --name-only "$HEAD_SHA")" \
            || { echo "git ls-tree failed on the head tree"; exit 1; }
          declare -A base_folded=()
          # Folded keys with several distinct base spellings (a pre-existing
          # collision) are ambiguous: a head path touching such a key may be
          # collision cleanup, not a new violation. The head-tree collision
          # scan above still rejects a head that leaves the collision in place.
          declare -A base_ambiguous=()
          record_base() {
            local key="$1" spelling="$2"
            if [[ -n "${base_folded[$key]:-}" && "${base_folded[$key]}" != "$spelling" ]]; then
              base_ambiguous["$key"]=1
            else
              base_folded["$key"]="$spelling"
            fi
          }
          while IFS= read -r path; do
            if [[ -n "$path" ]]; then record_base "${path,,}" "$path"; fi
            dir="$path"
            while [[ "$dir" == */* ]]; do
              dir="${dir%/*}"
              record_base "${dir,,}" "$dir"
            done
          done <<< "$base_tree"
          conflicts=0
          while IFS= read -r path; do
            if [[ -z "$path" ]]; then continue; fi
            folded="${path,,}"
            probe="$path"
            while [[ "$probe" == */* ]]; do
              probe="${probe%/*}"
              pfold="${probe,,}"
              if [[ -z "${base_ambiguous[$pfold]:-}" && -n "${base_folded[$pfold]:-}" \
                  && "${base_folded[$pfold]}" != "$probe" ]]; then
                printf 'Case-colliding path: %s conflicts with existing %s\n' \
                  "$path" "${base_folded[$pfold]}"
                conflicts=1
                break
              fi
            done
            if [[ -z "${base_ambiguous[$folded]:-}" && -n "${base_folded[$folded]:-}" \
                && "${base_folded[$folded]}" != "$path" ]]; then
              printf 'Case-colliding path: %s conflicts with existing %s\n' \
                "$path" "${base_folded[$folded]}"
              conflicts=1
            fi
          done <<< "$head_tree"
          if [[ "$conflicts" -ne 0 ]]; then
            echo "Add files under the existing casing of the path," \
              "or move the content to a case-distinct path."
            exit 1
          fi
          echo "No paths collide with the base tree."
